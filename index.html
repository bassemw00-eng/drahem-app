<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صيدليات دراهم</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<meta name="theme-color" content="#0e1a17">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f7f5;--sf:#fff;--tx:#12302a;--mu:#5b7a72;--ac:#0f7a5c;--ac2:#e3f3ed;--bd:#d5e3de;--rd:#c0392b;--or:#b9770e}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a17;--sf:#16251f;--tx:#e6f1ed;--mu:#8fb0a6;--ac:#3cc79a;--ac2:#1d3a31;--bd:#27403a;--rd:#ff7b6b;--or:#f0b44c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;font-size:16px;line-height:1.6;padding:env(safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 4px}
h1{margin:0;font-size:20px}header small{color:var(--mu);display:block}
main{padding:10px 14px;max-width:640px;margin:auto}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:17px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:inherit;font-size:14px;border:0;border-radius:9px;padding:8px 14px;background:var(--ac);color:#fff;cursor:pointer;font-weight:600}
button.sec{background:var(--ac2);color:var(--ac)}button.del{background:transparent;color:var(--rd);padding:4px 8px}
button:disabled{opacity:.45}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.big button{padding:12px 8px;font-size:15px}.big .out{background:var(--or)}
.it{padding:10px 0;border-bottom:1px solid var(--bd)}.it:last-child{border:0}.it small,.msg{color:var(--mu);font-size:14px}
.late{color:var(--rd)}.ot{color:var(--or)}
table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:14px}th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:600}
header{border-bottom:1px solid #d9a90f55;padding-bottom:10px}
.lg{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 2px #d9a90f;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kc{display:block;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:right;font-weight:400;min-height:108px;line-height:1.5}
.kc b{display:block;font-size:28px;color:var(--ac);margin:2px 0}
.kc span{font-size:13px;color:var(--mu)}
.kc.w{grid-column:1/-1;min-height:0}
.kc span.tag{font-size:12px;color:var(--ac);background:var(--ac2)}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
#dr{position:fixed;top:0;bottom:0;right:0;width:78%;max-width:300px;background:var(--sf);border-left:1px solid var(--bd);z-index:21;transform:translateX(100%);transition:transform .22s;padding:calc(14px + env(safe-area-inset-top)) 12px 20px;overflow-y:auto}
body.mo #dr{transform:none}body.mo #ov{display:block}
#dr .dh{padding:4px 6px 14px;margin-bottom:8px;border-bottom:1px solid var(--bd)}#dr .dh b{display:block;font-size:17px}#dr .dh small{color:var(--mu)}
#dr button{display:block;width:100%;text-align:right;background:transparent;color:var(--tx);padding:12px;font-size:15px;font-weight:500;margin-bottom:2px}
#dr button.on{background:var(--ac2);color:var(--ac);font-weight:700}
#dr button.sec{background:var(--ac2);color:var(--ac);text-align:center}
.tag{font-size:12px;background:var(--ac2);color:var(--ac);padding:2px 8px;border-radius:8px;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;min-width:70px;background:transparent;color:var(--mu);font-size:14px;font-weight:500}nav button.on{color:var(--ac);font-weight:700}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;background:var(--tx);color:var(--bg);padding:12px;border-radius:12px;display:none;z-index:9;text-align:center}
</style>
</head>
<body>
<div id="toast"></div>
<header><div style="display:flex;align-items:center;gap:10px"><button class="sec" id="mb" data-a="menu" style="display:none;padding:6px 11px;font-size:18px">☰</button><img id="hl" class="lg" alt=""><div><h1>صيدليات دراهم</h1><small id="who"></small></div></div><button class="sec" id="lo" data-a="logout" style="display:none">خروج</button></header>
<main id="v"></main>
<div id="ov" data-a="menu"></div><aside id="dr"></aside>

function punch(t){

  navigator.geolocation.getCurrentPosition(async p=>{
    const {data,error}=await sb.rpc(t=="in"?"punch_in":"punch_out",{p_lat:p.coords.latitude,p_lng:p.coords.longitude});
    if(error)toast(error.message);
    else toast(t=="in"?"تم تسجيل الحضور"+(data.late_min?" (تأخير "+fm(data.late_min)+")":""):"تم تسجيل الانصراف"+(data.overtime_min?" (أوفر تايم "+fm(data.overtime_min)+")":""));

  },()=>{$("loc").textContent="";toast("تعذر تحديد موقعك. فعّل الموقع وأعطِ التطبيق الإذن")},{enableHighAccuracy:true,timeout:15000,maximumAge:0})

let MP=null,MM={},MC=null,MT=null,MD=[],WID=null,WL=null,LS=0,LP=null;
const dist=(a,b,c,d)=>{const R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
async function wl(){try{if("wakeLock" in navigator&&!WL){WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null})}}catch(e){}}
function startTrack(){
  if(WID!=null||!me||me.role!="courier"||!navigator.geolocation)return;
  WID=navigator.geolocation.watchPosition(p=>{
    const n=Date.now(),c=p.coords;
    if(LP&&n-LS<20000)return;
    if(LP&&dist(LP[0],LP[1],c.latitude,c.longitude)<40&&n-LS<120000)return;
    LS=n;LP=[c.latitude,c.longitude];
    sb.rpc("update_location",{p_lat:c.latitude,p_lng:c.longitude,p_acc:c.accuracy}).then(r=>{if(r.error&&r.error.message.indexOf("حضور")>-1)stopTrack()})
  },()=>{stopTrack()},{enableHighAccuracy:true,maximumAge:10000,timeout:30000});
  wl()
}
function stopTrack(){if(WID!=null){navigator.geolocation.clearWatch(WID);WID=null}if(WL){WL.release().catch(()=>{});WL=null}LP=null}

  if(MM[c.c_id])MM[c.c_id].setLatLng([c.c_lat,c.c_lng]).setStyle({color:col,fillColor:col});
  else MM[c.c_id]=L.circleMarker([c.c_lat,c.c_lng],{radius:10,color:col,fillColor:col,fillOpacity:.9,weight:2}).bindTooltip(c.c_name,{permanent:true,direction:"top",offset:[0,-8]}).addTo(MP)
}
function mlist(){

function killMap(){if(MP){MP.remove();MP=null}MM={};if(MC){sb.removeChannel(MC);MC=null}if(MT){clearInterval(MT);MT=null}}
function initMap(){
  if(typeof L==="undefined"||!$("map"))return;
  killMap();

  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(MP);
  const pts=[];
  C.b.forEach(b=>{pts.push([b.lat,b.lng]);L.circle([b.lat,b.lng],{radius:b.radius_m,color:"#d9a90f",weight:1,fillOpacity:.08}).addTo(MP);L.circleMarker([b.lat,b.lng],{radius:6,color:"#d9a90f",fillColor:"#d9a90f",fillOpacity:1}).bindTooltip(b.name,{permanent:true,direction:"bottom"}).addTo(MP)});
  MD.forEach(c=>{putMarker(c);if(c.c_lat!=null)pts.push([c.c_lat,c.c_lng])});
  if(pts.length)MP.fitBounds(pts,{padding:[30,30],maxZoom:16});
  mlist();
  MC=sb.channel("loc").on("postgres_changes",{event:"*",schema:"public",table:"courier_locations"},p=>{
    const r=p.eventType=="DELETE"?p.old:p.new;if(!r)return;
    const c=MD.find(x=>x.c_id==r.user_id);if(!c)return;
    if(p.eventType=="DELETE"){c.c_lat=null;if(MM[c.c_id]){MP.removeLayer(MM[c.c_id]);delete MM[c.c_id]}}
    else{c.c_lat=r.lat;c.c_lng=r.lng;c.c_upd=r.updated_at;putMarker(c)}
    mlist()}).subscribe();
  MT=setInterval(()=>{MD.forEach(putMarker);mlist()},30000)
}

async function runRep(){
  R.from=val("rf");R.to=val("rt");R.b=val("rb");
  if(!R.from||!R.to)return toast("اختر تاريخ البداية والنهاية");
  let q=sb.from("attendance").select("*,profiles!inner(full_name,branch_id)").gte("work_date",R.from).lte("work_date",R.to).order("work_date").order("check_in").limit(5000);
  if(R.b)q=q.eq("profiles.branch_id",R.b);
  const {data,error}=await q;
  if(error)return toast(error.message);
  R.rows=(data||[]).map(r=>({d:r.work_date,n:r.profiles.full_name,b:(C.b.find(x=>x.id==r.profiles.branch_id)||{}).name||"-",i:r.check_in,o:r.check_out,w:r.work_min,l:r.late_min,ot:r.overtime_min}));
  render()
}

  const det=rows.map(r=>({"التاريخ":r.d,"الموظف":r.n,"الفرع":r.b,"وقت الحضور":tm(r.i),"وقت الانصراف":r.o?tm(r.o):"لم ينصرف","ساعات الحضور":hh(r.w),"دقائق التأخير":r.l,"الساعات الإضافية":hh(r.ot)}));
  const m={};
  rows.forEach(r=>{const x=m[r.n]=m[r.n]||{"الموظف":r.n,"أيام الحضور":0,"ساعات الحضور":0,"دقائق التأخير":0,"الساعات الإضافية":0};x["أيام الحضور"]++;x["ساعات الحضور"]+=r.w/60;x["دقائق التأخير"]+=r.l;x["الساعات الإضافية"]+=r.ot/60});
  const sum=Object.keys(m).map(k=>{const x=m[k];x["ساعات الحضور"]=Math.round(x["ساعات الحضور"]*100)/100;x["الساعات الإضافية"]=Math.round(x["الساعات الإضافية"]*100)/100;return x});
  const wb=XLSX.utils.book_new();
  wb.Workbook={Views:[{RTL:true}]};
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sum),"الملخص");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(det),"التفاصيل");
  XLSX.writeFile(wb,"attendance-"+R.from+"_"+R.to+".xlsx")
}

document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-t],[data-a],[data-del]");if(!t)return;
  if(t.dataset.t){document.body.classList.remove("mo");tab=t.dataset.t;H.detail=null;O.id=null;O.form=null;RQ.id=null;RQ.form=null;PY.id=null;return render()}
  if(t.dataset.del){const [tb,id]=t.dataset.del.split(":");const {error}=await sb.from(tb).delete().eq("id",id);if(error)return toast(error.message.indexOf("foreign")>-1?"لا يمكن الحذف لأنه مستخدم عند موظفين":error.message);await loadRef();return render()}
  const a=t.dataset.a;
  if(a=="login"){let u=val("lu");if(u.indexOf("@")<0)u=u.toLowerCase()+"@drahem.app";const {error}=await sb.auth.signInWithPassword({email:u,password:$("lp").value});if(error)toast("خطأ في الدخول: "+error.message);else boot().catch(x=>toast("خطأ: "+x.message))}
  else if(a=="logout"){if(ch){sb.removeChannel(ch);ch=null}unread=0;stopTrack();killMap();await sb.auth.signOut();me=null;render()}
  else if(a=="in"||a=="out")punch(a);
  else if(a=="rep")runRep();
  else if(a=="xls")exportXls();
  else if(a=="beep")beep();
  else if(a=="popen"){PY.id=t.dataset.id;render()}
  else if(a=="pback"){PY.id=null;render()}
  else if(a=="pxls")exportPay();

  else if(a=="padd"){const am=parseFloat($("am").value);if(!(am>0))return toast("اكتب مبلغاً صحيحاً");const {error}=await sb.from("pay_adjustments").insert({user_id:t.dataset.id,month:mo(),kind:$("ak").value,amount:am,note:$("an").value.trim()||null});toast(error?error.message:"تمت الإضافة");render()}
  else if(a=="padel"){const {error}=await sb.from("pay_adjustments").delete().eq("id",t.dataset.id);toast(error?error.message:"تم الحذف");render()}
  else if(a=="ppay"){const r=PY.rows.find(x=>x.r_uid==t.dataset.id);const {error}=await(t.dataset.v=="1"?sb.from("pay_paid").upsert({user_id:t.dataset.id,month:mo(),amount:r.r_net,paid_at:new Date().toISOString()}):sb.from("pay_paid").delete().eq("user_id",t.dataset.id).eq("month",mo()));toast(error?error.message:"تم التحديث");render()}
  else if(a=="rnew"){RQ.form="new";RQ.id=null;RQ.items=[{n:"",q:1}];render()}
  else if(a=="radd"){syncItems();RQ.items.push({n:"",q:1});render()}
  else if(a=="rdel"){syncItems();RQ.items.splice(+t.dataset.i,1);if(!RQ.items.length)RQ.items=[{n:"",q:1}];render()}
  else if(a=="ropen"){RQ.id=+t.dataset.id;RQ.form=null;render()}
  else if(a=="rback"){RQ.id=null;RQ.form=null;render()}
  else if(a=="rformx"){RQ.form=null;render()}
  else if(a=="redit"){const {data}=await sb.from("customer_request_items").select("*").eq("request_id",RQ.id).order("id");RQ.items=(data||[]).map(i=>({n:i.item_name,q:i.qty,u:i.unavailable}));RQ.form=RQ.id;render()}
  else if(a=="rsave"){
    syncItems();const items=RQ.items.filter(x=>x.n);
    if(!val("qn")||!val("qp"))return toast("اكتب اسم العميل والموبايل");
    if(!items.length)return toast("أضف صنفاً واحداً على الأقل");
    const {data,error}=await sb.rpc("save_customer_request",{p_id:RQ.form=="new"?null:RQ.form,p_branch:+$("qb").value||null,p_name:val("qn"),p_phone:val("qp"),p_notes:val("qt")||null,p_items:items});
    if(error)return toast(error.message);
    RQ.id=data.id;RQ.form=null;toast("تم حفظ الطلب");render()}
  else if(a=="rst"){const n=$("rnote");const {error}=await sb.rpc("set_request_status",{p_id:RQ.id,p_status:t.dataset.s,p_note:n&&n.value.trim()?n.value.trim():null});toast(error?error.message:"تم تحديث الحالة");render()}
  else if(a=="rarch"){const {error}=await sb.from("customer_requests").update({archived:t.dataset.v=="1"}).eq("id",RQ.id);toast(error?error.message:(t.dataset.v=="1"?"تمت الأرشفة":"تم الإرجاع من الأرشيف"));render()}
  else if(a=="rrm"){if(!confirm("حذف الطلب نهائياً؟ لا يمكن التراجع."))return;const {error}=await sb.from("customer_requests").delete().eq("id",RQ.id);if(error)return toast(error.message);RQ.id=null;toast("تم حذف الطلب");render()}
  else if(a=="trk"){startTrack();render()}
  else if(a=="mref")render()
  else if(a=="mfly"){const c=MD.find(x=>x.c_id==t.dataset.id);if(c&&c.c_lat!=null&&MP){MP.flyTo([c.c_lat,c.c_lng],16);$("map").scrollIntoView({behavior:"smooth",block:"center"})}}
  else if(a=="menu")document.body.classList.toggle("mo");
  else if(a=="install"){if(DI){DI.prompt();DI=null;render()}}
  else if(a=="hopen"){H.detail=t.dataset.k;render()}
  else if(a=="hback"){H.detail=null;render()}
  else if(a=="onew"){O.form="new";render()}
  else if(a=="oopen"){O.id=+t.dataset.id;O.form=null;render()}
  else if(a=="oback"){O.id=null;O.form=null;render()}
  else if(a=="oedit"){O.form=O.id;render()}
  else if(a=="oformx"){O.form=null;render()}
  else if(a=="osave"){
    const d={customer_name:val("fn"),phone:val("fp"),address:val("fa"),area:val("far")||null,order_type:$("fty").value,amount:parseFloat(val("fam"))||null,delivery_fee:parseFloat(val("ffee"))||0,payment_method:$("fpm").value,collect_amount:val("fco")===""?null:parseFloat(val("fco")),branch_id:+$("fbr").value||null,notes:val("fnt")||null};
    if(!d.customer_name||!d.phone||!d.address)return toast("اكتب اسم العميل والموبايل والعنوان");
    if(O.form=="new"){const {data,error}=await sb.from("orders").insert(d).select().single();if(error)return toast(error.message);const c=$("fcr").value;if(c){const r=await sb.rpc("assign_order",{p_order:data.id,p_courier:c});if(r.error)toast("تم حفظ الطلب لكن: "+r.error.message)}O.id=data.id;O.form=null}
    else{d.updated_at=new Date().toISOString();const {error}=await sb.from("orders").update(d).eq("id",O.form);if(error)return toast(error.message);O.id=O.form;O.form=null}
    toast("تم حفظ الطلب");render()}
  else if(a=="ocancel"){const id=t.dataset.id;if(!confirm("إلغاء هذا الطلب؟"))return;const n=$("cx"+id);const {error}=await sb.rpc("cancel_order",{p_order:+id,p_note:n&&n.value.trim()?n.value.trim():null});toast(error?error.message:"تم إلغاء الطلب");render()}
  else if(a=="oarch"){const {error}=await sb.from("orders").update({archived:t.dataset.v=="1"}).eq("id",t.dataset.id);toast(error?error.message:(t.dataset.v=="1"?"تمت الأرشفة":"تم الإرجاع من الأرشيف"));render()}
  else if(a=="odel"){if(!confirm("حذف الطلب نهائياً؟ لا يمكن التراجع."))return;const {error}=await sb.from("orders").delete().eq("id",t.dataset.id);if(error)return toast(error.message);O.id=null;toast("تم حذف الطلب");render()}
  else if(a=="addord"){if(!val("oc")||!val("op")||!val("oa"))return toast("اكتب اسم العميل والموبايل والعنوان");const {error}=await sb.from("orders").insert({customer_name:val("oc"),phone:val("op"),address:val("oa"),notes:val("on")||null,amount:parseFloat(val("om"))||null,branch_id:+val("ob")||null});if(error)return toast(error.message);toast("تمت إضافة الطلب");render()}
  else if(a=="assign"){const id=t.dataset.id,c=$("c"+id).value;if(!c)return toast("لا يوجد مندوب حاضر للإسناد");const {error}=await sb.rpc("assign_order",{p_order:+id,p_courier:c});toast(error?error.message:"تم الإسناد وإرسال إشعار للمندوب");render()}
  else if(a=="step"){const id=t.dataset.id,st=t.dataset.s,n=$("n"+id),d=$("d"+id);const {error}=await sb.rpc("courier_step",{p_order:+id,p_status:st,p_note:n&&n.value.trim()?n.value.trim():null,p_until:d&&d.value?new Date(d.value).toISOString():null});toast(error?error.message:"تم التحديث");render()}
  else if(a=="here"){navigator.geolocation.getCurrentPosition(p=>{$("bla").value=p.coords.latitude.toFixed(6);$("blo").value=p.coords.longitude.toFixed(6);toast("تم تحديد الموقع، الدقة تقريباً "+Math.round(p.coords.accuracy)+" متر")},()=>toast("تعذر تحديد موقعك"),{enableHighAccuracy:true,timeout:15000})}
  else if(a=="addbr"){const la=parseFloat(val("bla")),lo=parseFloat(val("blo")),r=parseInt(val("br"));if(!val("bn")||isNaN(la)||isNaN(lo)||!r)return toast("اكتب الاسم والإحداثيات والنطاق");const {error}=await sb.from("branches").insert({name:val("bn"),lat:la,lng:lo,radius_m:r});if(error)return toast(error.message);await loadRef();render()}
  else if(a=="addsh"){if(!val("sn"))return toast("اكتب اسم الوردية");const {error}=await sb.from("shifts").insert({name:val("sn"),start_time:val("ss"),end_time:val("se"),grace_min:parseInt(val("sg"))||0});if(error)return toast(error.message);await loadRef();render()}
  else if(a=="addemp"){
    const un=val("en").toLowerCase(),nm=val("ef"),pw=$("ep").value;
    if(!nm||!un||pw.length<6)return toast("اكتب الاسم واسم المستخدم وكلمة سر 6 أحرف على الأقل");

    const {data,error}=await tmp.auth.signUp({email:un.indexOf("@")>-1?un:un+"@drahem.app",password:pw,options:{data:{full_name:nm}}});
    if(error||!data.user)return toast(error?error.message:"تعذر إنشاء الحساب");
    const e2=await sb.from("profiles").update({role:$("er").value,branch_id:+$("eb").value||null,shift_id:+$("es").value||null,active:true}).eq("id",data.user.id);
    if(e2.error)return toast(e2.error.message);
    toast("تمت إضافة الموظف");render()
  }
});
document.addEventListener("change",async ev=>{
  const e=ev.target;
  if(e.id=="pm"){PY.m=e.value||PY.m;PY.id=null;return render()}
  if(e.id=="qs"||e.id=="qf"){RQ.q=$("qs").value.trim();RQ.f=$("qf").value;return render()}
  if(e.dataset.u){const {error}=await sb.from("customer_request_items").update({unavailable:e.checked}).eq("id",e.dataset.u);toast(error?error.message:"تم الحفظ");return}
  if(e.dataset.p){const [r,pm]=e.dataset.p.split(":");const {error}=await(e.checked?sb.from("role_permissions").upsert({role:r,permission:pm}):sb.from("role_permissions").delete().eq("role",r).eq("permission",pm));toast(error?error.message:"تم الحفظ");if(error)render();return}
  if(e.id=="oq"||e.id=="of"){O.q=$("oq").value.trim();O.f=$("of").value;return render()}if(e.id=="hd"||e.id=="hb"){H.date=$("hd").value||H.date;H.b=$("hb").value;return render()}if(!e.dataset.f)return;
  if(e.dataset.id==me.id&&(e.dataset.f=="role"||e.dataset.f=="active")){toast("لا يمكنك تغيير دورك أو تعطيل حسابك");return render()}
  let v=e.value;if(e.dataset.f=="active")v=v=="true";else if(e.dataset.f!="role")v=+v||null;
  const {error}=await sb.from("profiles").update({[e.dataset.f]:v}).eq("id",e.dataset.id);
  if(error)toast(error.message);else toast("تم الحفظ");
  if(e.dataset.id==me.id)boot()
});
boot().catch(x=>toast("خطأ: "+x.message));
